name: Update GCC Data
on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install pandas numpy openpyxl requests
      - run: python etl.py
      - run: python build_dashboard.py
      - run: cp dashboard.html index.html
      - run: |
          git config user.name "Maya_Assem"
          git config user.email "maya.mohamed@idc.com"
          git add gcc_dashboard.json index.html
          git commit -m "Auto-update data $(date +'%Y-%m-%d')" || echo "No changes"
          git push
